name: Build and Push Docker Image
on:
  push:
    branches:
      - develop
      - feat-*
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4

      - name: Show Current Directory and Contents
        run: |
          pwd
          ls -la

      - name: Get Branch/Repo Info
        run: |
          echo "Current ref: ${{ gitea.ref }}"
          echo "Branch name: ${{ gitea.ref_name }}"
          echo "Repository name: ${{ gitea.repository }}"

      - name: Set and Show Variables
        run: |
          BRANCH_NAME="${{ gitea.ref_name }}"
          REPO_NAME="privacyflow-agent-zero-channel"
          REGISTRY="gitea.nocaplabs.fyi"
          OWNER="nocaplabs"
          echo "Branch variable content: $BRANCH_NAME"
          echo "Repository variable content: $REPO_NAME"
          echo "Full image name will be: $REGISTRY/$OWNER/$REPO_NAME:$BRANCH_NAME"
          echo "IMAGE_TAG=$REGISTRY/$OWNER/$REPO_NAME:$BRANCH_NAME" >> $GITEA_ENV
          echo "OUTSIDE_IMAGE_TAG=outside-oci.nocaplabs.fyi/$OWNER/$REPO_NAME:$BRANCH_NAME" >> $GITEA_ENV

      - name: Login to Gitea Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: gitea.nocaplabs.fyi
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGE_TOKEN_GITEA }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_TAG }} .

      - name: Push to Gitea Registry
        run: |
          docker push ${{ env.IMAGE_TAG }}

      - name: Copy to Outside OCI Registry (Skopeo)
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          
          skopeo copy --src-creds="${{ gitea.actor }}:${{ secrets.PACKAGE_TOKEN_GITEA }}" \
                      --dest-creds="admin:${{ secrets.OUTSIDE_OCI_READ_WRITE_KEY }}" \
                      docker://${{ env.IMAGE_TAG }} \
                      docker://${{ env.OUTSIDE_IMAGE_TAG }}
